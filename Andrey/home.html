<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>NovaBank | Bienvenida</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/home.css">
</head>
<body>

    <div class="glow"></div>

    <div class="container">
        <div class="home-card">

            <div class="logo">
                <h1>Nova<span>Bank</span></h1>
            </div>

            <div class="welcome">
                <h2>Bienvenido</h2>
                <p>Gestiona tu dinero de forma segura y rápida</p>
            </div>

            <button class="btn login-btn">Iniciar sesión</button>

            <div class="divider"></div>

            <div class="actions">
                <button>Transferir</button>
                <button>Depositar</button>
                <button>Historial</button>
            </div>

            <div class="footer">
                Accede para utilizar todas las funciones
            </div>

        </div>
    </div>

</body>
</html>
