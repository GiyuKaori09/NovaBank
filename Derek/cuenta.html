<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Cuenta - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="phone-frame dashboard">
        <div class="header-bank">
            <p>Hola, <strong>Usuario</strong></p>
            <div class="header-icons">
                <i class="fa-solid fa-eye-slash"></i>
                <i class="fa-solid fa-bullhorn"></i>
            </div>
        </div>

        <div class="balance-section">
            <p class="label-small">Tu dinero <i class="fa-regular fa-circle-question"></i></p>
            <h2 class="main-balance">45,280.<span>00€</span></h2>
        </div>

        <div class="quick-actions">
            <div class="action-item"><div class="circle-btn"><i class="fa-solid fa-paper-plane"></i></div><span>Enviar</span></div>
            <div class="action-item"><div class="circle-btn"><i class="fa-solid fa-percent"></i></div><span>Promos</span></div>
            <div class="action-item"><div class="circle-btn"><i class="fa-solid fa-file-invoice"></i></div><span>Recibos</span></div>
            <div class="action-item"><div class="circle-btn"><i class="fa-solid fa-ellipsis"></i></div><span>Más</span></div>
        </div>

        <div class="card-info neumorph-card">
            <div class="card-header">
                <span>CUENTA PRINCIPAL</span>
                <i class="fa-solid fa-building-columns"></i>
            </div>
            <p class="acc-number">ES34 8829 1022 3445 9012</p>
            <div class="card-details">
                <div><small>Propietario</small><p>JUAN PEREZ</p></div>
                <div><small>Vigencia</small><p>12/28</p></div>
            </div>
            <div class="card-footer">
                <p>Saldo: <strong>43,280.00€</strong></p>
                <span class="badge">Débito</span>
            </div>
        </div>

        <div class="transactions-section">
            <p class="section-title">Últimos movimientos</p>
            <div class="transaction-item">
                <i class="fa-solid fa-cart-shopping"></i>
                <div class="trans-info">
                    <p>Supermercado Central</p>
                    <small>Hoy, 14:20</small>
                </div>
                <span class="amount negative">-$850.00</span>
            </div>
            <div class="transaction-item">
                <i class="fa-solid fa-money-bill-transfer"></i>
                <div class="trans-info">
                    <p>Transferencia Recibida</p>
                    <small>Ayer, 09:15</small>
                </div>
                <span class="amount positive">+$2,400.00</span>
            </div>
        </div>
    </div>
</body>
</html>
